<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAPPS - Diagnóstico Empresarial</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #120037;
            --accent: #3CDBC0;
            --accent-glow: rgba(60, 219, 192, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(60, 219, 192, 0.05);
            --card-border: rgba(60, 219, 192, 0.2);
            --neon-blue: #00D4FF;
            --neon-cyan: #00FFF0;
            --critical: #FF3366;
            --warning: #FFB800;
            --good: #00FF88;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(135deg, #120037 0%, #1a0052 50%, #0d0028 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(60, 219, 192, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(0, 255, 240, 0.05) 0%, transparent 50%);
            animation: bgPulse 15s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--neon-blue), var(--neon-cyan));
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px var(--accent-glow), 0 0 40px var(--accent-glow);
        }

        .progress-text {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            z-index: 1001;
            text-shadow: 0 0 10px var(--accent-glow);
            letter-spacing: 1px;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo/Brand */
        .brand {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .brand h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand p {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Question Container */
        .question-container {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .question-container.fade-out {
            animation: fadeOut 0.4s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-30px);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .question-text {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 50px;
            color: var(--text-primary);
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 24px 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent), var(--neon-blue));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .option-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .option-letter {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(60, 219, 192, 0.1);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            color: var(--accent);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: var(--accent);
            transform: translateX(10px);
            box-shadow:
                0 10px 30px rgba(60, 219, 192, 0.2),
                0 0 40px rgba(60, 219, 192, 0.1);
        }

        .option:hover::before {
            opacity: 0.1;
        }

        .option:hover .option-letter {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .option.selected {
            border-color: var(--accent);
            background: rgba(60, 219, 192, 0.15);
            box-shadow:
                0 10px 40px rgba(60, 219, 192, 0.3),
                0 0 60px rgba(60, 219, 192, 0.2),
                inset 0 0 20px rgba(60, 219, 192, 0.1);
        }

        .option.selected::before {
            opacity: 0.2;
        }

        .option.selected .option-letter {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Navigation Buttons */
        .navigation {
            margin-top: 60px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .nav-btn {
            padding: 16px 40px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: var(--accent);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
            z-index: 0;
        }

        .nav-btn span {
            position: relative;
            z-index: 1;
        }

        .nav-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .nav-btn:hover {
            color: var(--bg-primary);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        .nav-btn:disabled:hover {
            box-shadow: none;
            color: rgba(255, 255, 255, 0.2);
        }

        .nav-btn:disabled::before {
            display: none;
        }

        .btn-next {
            margin-left: auto;
        }

        /* Results Page */
        .results-container {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s ease-out forwards;
            padding-bottom: 60px;
        }

        .results-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .results-header h2 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .results-header p {
            font-size: 18px;
            color: var(--text-secondary);
        }

        .score-display {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .score-number {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .score-label {
            font-size: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Chart Section */
        .chart-section {
            margin-bottom: 60px;
            padding: 40px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .chart-section h3 {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #areasChart {
            max-height: 400px;
        }

        /* Diagnosis Section */
        .diagnosis-section {
            margin-bottom: 60px;
            padding: 40px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .diagnosis-section h3 {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .diagnosis-item {
            padding: 20px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            animation: fadeInUp 0.6s ease-out forwards;
            animation-delay: calc(var(--item-index) * 0.1s);
            opacity: 0;
        }

        .diagnosis-item.critical {
            border-left-color: var(--critical);
        }

        .diagnosis-item.warning {
            border-left-color: var(--warning);
        }

        .diagnosis-item.good {
            border-left-color: var(--good);
        }

        .diagnosis-item.advanced {
            border-left-color: var(--accent);
        }

        /* CTA Section */
        .cta-section {
            padding: 40px;
            background: linear-gradient(135deg, rgba(60, 219, 192, 0.1), rgba(0, 212, 255, 0.1));
            border: 2px solid var(--accent);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(60, 219, 192, 0.2);
            margin-bottom: 40px;
        }

        .cta-section h3 {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-content {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 30px;
            text-align: center;
        }

        .cta-highlight {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            margin: 20px 0;
            text-align: center;
        }

        .restart-btn {
            margin-top: 20px;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--accent), var(--neon-blue));
            border: none;
            color: var(--bg-primary);
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 40px rgba(60, 219, 192, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(60, 219, 192, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 60px 20px;
            }

            .brand h1 {
                font-size: 36px;
            }

            .question-text {
                font-size: 24px;
            }

            .option {
                padding: 20px;
            }

            .option-text {
                font-size: 16px;
            }

            .navigation {
                flex-direction: column;
            }

            .btn-next {
                margin-left: 0;
            }

            .progress-text {
                top: 15px;
                right: 15px;
                font-size: 12px;
            }

            .results-header h2 {
                font-size: 32px;
            }

            .score-number {
                font-size: 56px;
            }

            .chart-section, .diagnosis-section, .cta-section {
                padding: 24px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">0%</div>

    <div class="container">
        <!-- Brand -->
        <div class="brand" id="brand">
            <h1>FAPPS</h1>
            <p>Diagnóstico Empresarial Inteligente</p>
        </div>

        <!-- Question Container -->
        <div class="question-container" id="questionContainer">
            <div class="question-number" id="questionNumber">PERGUNTA 1 DE 22</div>
            <h2 class="question-text" id="questionText"></h2>
            <div class="options" id="options"></div>

            <div class="navigation">
                <button class="nav-btn" id="prevBtn" onclick="previousQuestion()" disabled>
                    <span>← Anterior</span>
                </button>
                <button class="nav-btn btn-next" id="nextBtn" onclick="nextQuestion()" disabled>
                    <span>Próxima →</span>
                </button>
            </div>
        </div>

        <!-- Results Container -->
        <div class="results-container hidden" id="resultsContainer">
            <div class="results-header">
                <h2>Resultado do Diagnóstico</h2>
                <p>Análise completa da maturidade da sua empresa</p>
            </div>

            <div class="score-display">
                <div class="score-number" id="scoreNumber">0</div>
                <div class="score-label">Pontuação Total (0-2200)</div>
            </div>

            <!-- Chart Section -->
            <div class="chart-section">
                <h3>📊 Maturidade por Área</h3>
                <canvas id="areasChart"></canvas>
            </div>

            <!-- Diagnosis Section -->
            <div class="diagnosis-section">
                <h3>📌 Mapa de Prioridade de Automação</h3>
                <div id="diagnosisList"></div>
            </div>

            <!-- CTA Section -->
            <div class="cta-section" id="ctaSection">
                <!-- Generated dynamically -->
            </div>

            <button class="restart-btn" onclick="restartForm()">Reiniciar Diagnóstico</button>
        </div>
    </div>

    <script>
        // Area Mapping

                ]
            },
            {
                id: 'p16',
                text: 'Marketing conversa com Comercial?',
                options: [
                    { text: 'Não existe comunicação', score: 0 },
                    { text: 'Solta', score: 25 },
                    { text: 'Manual', score: 50 },
                    { text: 'Integrado', score: 75 },
                    { text: 'Integrado e automatizado', score: 100 }
                ]
            },
            {
                id: 'p17',
                text: 'Quanto do seu marketing é improvisado?',
                options: [
                    { text: 'Quase tudo', score: 0 },
                    { text: 'Boa parte', score: 25 },
                    { text: 'Às vezes', score: 50 },
                    { text: 'Pouco', score: 75 },
                    { text: 'Nada', score: 100 }
                ]
            },
            {
                id: 'p18',
                text: 'Como você sabe quem está fazendo o quê na equipe?',
                options: [
                    { text: 'Não sei', score: 0 },
                    { text: 'Perguntando', score: 25 },
                    { text: 'Planilha', score: 50 },
                    { text: 'Ferramenta', score: 75 },
                    { text: 'Ferramenta + indicadores', score: 100 }
                ]
            },
            {
                id: 'p19',
                text: 'Como é o onboarding de novos colaboradores?',
                options: [
                    { text: 'Totalmente improvisado', score: 0 },
                    { text: 'Parcialmente improvisado', score: 25 },
                    { text: 'Manual com checklist', score: 50 },
                    { text: 'Sistema claro', score: 75 },
                    { text: 'Sistema + automações', score: 100 }
                ]
            },
            {
                id: 'p20',
                text: 'Quando há atraso, você descobre como?',
                options: [
                    { text: 'Cliente reclamando', score: 0 },
                    { text: 'Funcionário avisando', score: 25 },
                    { text: 'Procurando manualmente', score: 50 },
                    { text: 'Sistema', score: 75 },
                    { text: 'Sistema + alertas automáticos', score: 100 }
                ]
            },
            {
                id: 'p21',
                text: 'Se você precisasse ficar 7 dias totalmente fora da empresa (sem WhatsApp, sem ligação), o negócio continuaria rodando?',
                options: [
                    { text: 'Não, a empresa para', score: 0 },
                    { text: 'Até roda, mas com muito problema', score: 25 },
                    { text: 'Rodaria, mas com queda de qualidade', score: 50 },
                    { text: 'Rodaria bem, com poucos ajustes', score: 75 },
                    { text: 'Rodaria normalmente, porque os processos já estão organizados e automatizados', score: 100 }
                ]
            },
            {
                id: 'p22',
                text: 'O que mais impede sua empresa de escalar?',
                options: [
                    { text: 'Processos manuais', score: 0 },
                    { text: 'Falta de organização', score: 25 },
                    { text: 'Falta de integração', score: 50 },
                    { text: 'Falta de automação', score: 75 },
                    { text: 'Nada, só falta aumentar demanda', score: 100 }
                ]
            }
        ];

        let currentQuestion = 0;
        let answers = {};
        const optionLetters = ['A', 'B', 'C', 'D', 'E'];

        // Shuffle function
        function shuffleAlternatives(alts) {
            return [...alts].sort(() => Math.random() - 0.5);
        }

        function renderQuestion() {
            const question = questions[currentQuestion];

            document.getElementById('questionNumber').textContent = `PERGUNTA ${currentQuestion + 1} DE ${questions.length}`;
            document.getElementById('questionText').textContent = question.text;

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            // Shuffle options
            const shuffledOptions = shuffleAlternatives(question.options);

            shuffledOptions.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.setAttribute('data-score', option.score);
                optionDiv.setAttribute('data-option-text', option.text);

                if (answers[question.id]?.text === option.text) {
                    optionDiv.classList.add('selected');
                }

                optionDiv.innerHTML = `
                    <div class="option-content">
                        <div class="option-letter">${optionLetters[index]}</div>
                        <div class="option-text">${option.text}</div>
                    </div>
                `;

                optionDiv.addEventListener('click', () => selectOption(option.text, option.score));
                optionsContainer.appendChild(optionDiv);
            });

            updateNavigation();
            updateProgress();
        }

        function selectOption(optionText, score) {
            const question = questions[currentQuestion];
            answers[question.id] = { text: optionText, score: score };

            // Remove selected class from all options
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });

            // Add selected class to clicked option
            event.currentTarget.classList.add('selected');

            // Enable next button
            document.getElementById('nextBtn').disabled = false;

            // Auto advance after a short delay
            setTimeout(() => {
                if (currentQuestion < questions.length - 1) {
                    nextQuestion();
                }
            }, 500);
        }

        function nextQuestion() {
            if (!answers[questions[currentQuestion].id]) {
                return;
            }

            if (currentQuestion < questions.length - 1) {
                // Fade out
                const container = document.getElementById('questionContainer');
                container.classList.add('fade-out');

                setTimeout(() => {
                    currentQuestion++;
                    container.classList.remove('fade-out');
                    renderQuestion();
                }, 400);
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                const container = document.getElementById('questionContainer');
                container.classList.add('fade-out');

                setTimeout(() => {
                    currentQuestion--;
                    container.classList.remove('fade-out');
                    renderQuestion();
                }, 400);
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = !answers[questions[currentQuestion].id];

            if (currentQuestion === questions.length - 1 && answers[questions[currentQuestion].id]) {
                nextBtn.querySelector('span').textContent = 'Ver Resultado →';
            } else {
                nextBtn.querySelector('span').textContent = 'Próxima →';
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').textContent = Math.round(progress) + '%';
        }

        function calculateAreaScores() {
            const areaScores = {};

            Object.entries(areaMapping).forEach(([areaName, questionNumbers]) => {
                let totalScore = 0;
                let count = 0;

                questionNumbers.forEach(qNum => {
                    const questionId = `p${qNum}`;
                    if (answers[questionId]) {
                        totalScore += answers[questionId].score;
                        count++;
                    }
                });

                // Calculate average (0-100)
                areaScores[areaName] = count > 0 ? Math.round(totalScore / count) : 0;
            });

            return areaScores;
        }

        function gerarDiagnosticoArea(nome, score) {
            if (score < 30) {
                return {
                    text: `${nome}: nível CRÍTICO. Processos manuais estão drenando tempo e travando escala. Esta área deve ser a prioridade nº1 para automação.`,
                    level: 'critical'
                };
            }
            if (score < 60) {
                return {
                    text: `${nome}: nível INTERMEDIÁRIO. Existe organização, mas ainda depende de esforço manual. Automação aqui reduz retrabalho e riscos.`,
                    level: 'warning'
                };
            }
            if (score < 80) {
                return {
                    text: `${nome}: nível BOM. Funciona bem, mas ainda há espaço para ganhar eficiência e velocidade.`,
                    level: 'good'
                };
            }
            return {
                text: `${nome}: nível AVANÇADO. Esta área já está preparada para escala.`,
                level: 'advanced'
            };
        }

        function showResults() {
            // Calculate total score
            let totalScore = 0;
            questions.forEach(question => {
                if (answers[question.id]) {
                    totalScore += answers[question.id].score;
                }
            });

            // Calculate area scores
            const areaScores = calculateAreaScores();

            // Sort areas by score (worst to best)
            const sortedAreas = Object.entries(areaScores).sort((a, b) => a[1] - b[1]);

            // Hide question container
            document.getElementById('questionContainer').classList.add('hidden');
            document.getElementById('brand').classList.add('hidden');

            // Show results container
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.classList.remove('hidden');

            // Display total score
            document.getElementById('scoreNumber').textContent = totalScore;

            // Create Chart
            createAreasChart(areaScores);

            // Generate diagnosis
            const diagnosisList = document.getElementById('diagnosisList');
            diagnosisList.innerHTML = '';

            sortedAreas.forEach(([areaName, score], index) => {
                const diagnosis = gerarDiagnosticoArea(areaName, score);
                const diagnosisDiv = document.createElement('div');
                diagnosisDiv.className = `diagnosis-item ${diagnosis.level}`;
                diagnosisDiv.style.setProperty('--item-index', index);
                diagnosisDiv.textContent = `• ${diagnosis.text}`;
                diagnosisList.appendChild(diagnosisDiv);
            });

            // Generate CTA
            const [areaCritica, scoreCritico] = sortedAreas[0];
            const ctaSection = document.getElementById('ctaSection');
            ctaSection.innerHTML = `
                <h3>🎯 Próximo Passo Recomendado</h3>
                <div class="cta-highlight">Seu maior gargalo hoje é: ${areaCritica}</div>
                <div class="cta-content">
                    <p style="margin-bottom: 16px;">Maturidade atual: <strong>${scoreCritico}/100</strong></p>
                    <p style="margin-bottom: 16px;">Essa é a área que mais está consumindo tempo, causando retrabalho e limitando o crescimento da sua empresa.</p>
                    <p style="margin-bottom: 16px;">O próximo passo é criar um <strong>plano de automação específico</strong> para essa área, eliminando processos manuais e aumentando a previsibilidade operacional.</p>
                    <p><strong>Recomendação:</strong> agende uma reunião estratégica para traçarmos esse plano imediatamente.</p>
                </div>
            `;

            // Update progress to 100%
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = '100%';

            // Log JSON to console
            console.log('Respostas em JSON:', JSON.stringify(answers, null, 2));
            console.log('Scores por área:', areaScores);
            console.log('Área crítica:', areaCritica, '- Score:', scoreCritico);
        }

        function createAreasChart(areaScores) {
            const ctx = document.getElementById('areasChart').getContext('2d');

            // Sort data for better visualization
            const sortedData = Object.entries(areaScores).sort((a, b) => a[1] - b[1]);
            const labels = sortedData.map(([name]) => name);
            const data = sortedData.map(([, score]) => score);

            // Create gradient colors based on score
            const backgroundColors = data.map(score => {
                if (score < 30) return 'rgba(255, 51, 102, 0.8)'; // Critical
                if (score < 60) return 'rgba(255, 184, 0, 0.8)'; // Warning
                if (score < 80) return 'rgba(0, 255, 136, 0.8)'; // Good
                return 'rgba(60, 219, 192, 0.8)'; // Advanced
            });

            const borderColors = data.map(score => {
                if (score < 30) return 'rgba(255, 51, 102, 1)';
                if (score < 60) return 'rgba(255, 184, 0, 1)';
                if (score < 80) return 'rgba(0, 255, 136, 1)';
                return 'rgba(60, 219, 192, 1)';
            });

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Maturidade por Área (0-100)',
                        data: data,
                        backgroundColor: backgroundColors,
                        borderColor: borderColors,
                        borderWidth: 2,
                        borderRadius: 8,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(18, 0, 55, 0.95)',
                            titleColor: '#3CDBC0',
                            bodyColor: '#ffffff',
                            borderColor: '#3CDBC0',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return `Maturidade: ${context.parsed.y}/100`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                color: '#ffffff',
                                font: {
                                    size: 12,
                                    family: 'Inter'
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#3CDBC0',
                                font: {
                                    size: 12,
                                    family: 'Inter',
                                    weight: '600'
                                }
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        function restartForm() {
            currentQuestion = 0;
            answers = {};

            document.getElementById('resultsContainer').classList.add('hidden');
            document.getElementById('questionContainer').classList.remove('hidden');
            document.getElementById('brand').classList.remove('hidden');

            renderQuestion();
        }

        // Initialize
        renderQuestion();
    </script>
</body>
